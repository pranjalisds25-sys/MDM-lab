
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #3730a3;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3730a3;
        }

        .reset-btn {
            background: #64748b;
        }

        .reset-btn:hover {
            background: #475569;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f1f5f9;
        }

        .result h2 {
            text-align: center;
            color: #3730a3;
            margin-bottom: 15px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .grade {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #16a34a;
            margin-top: 15px;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <p class="subtitle">
            Enter marks for five subjects
        </p>

        <!-- Marks Input -->
        <div class="input-group">
            <label for="subject1">Mathematics</label>
            <input type="number" id="subject1"
                   placeholder="Enter marks (0-100)"
                   min="0" max="100">
        </div>

        <div class="input-group">
            <label for="subject2">Science</label>
            <input type="number" id="subject2"
                   placeholder="Enter marks (0-100)"
                   min="0" max="100">
        </div>

        <div class="input-group">
            <label for="subject3">English</label>
            <input type="number" id="subject3"
                   placeholder="Enter marks (0-100)"
                   min="0" max="100">
        </div>

        <div class="input-group">
            <label for="subject4">Computer Science</label>
            <input type="number" id="subject4"
                   placeholder="Enter marks (0-100)"
                   min="0" max="100">
        </div>

        <div class="input-group">
            <label for="subject5">Social Science</label>
            <input type="number" id="subject5"
                   placeholder="Enter marks (0-100)"
                   min="0" max="100">
        </div>

        <!-- Buttons -->
        <button onclick="calculateResult()">
            Calculate Result
        </button>

        <button class="reset-btn" onclick="resetCalculator()">
            Reset
        </button>

        <p id="error" class="error"></p>


        <!-- Result -->
        <div id="result" class="result">

            <h2>Result</h2>

            <div class="result-row">
                <span>Total Marks</span>
                <strong id="total"></strong>
            </div>

            <div class="result-row">
                <span>Maximum Marks</span>
                <strong>500</strong>
            </div>

            <div class="result-row">
                <span>Percentage</span>
                <strong id="percentage"></strong>
            </div>

            <div class="grade">
                Grade: <span id="grade"></span>
            </div>

        </div>

    </div>


    <script>

        function calculateResult() {

            let marks = [];

            // Get marks from all five subjects
            for (let i = 1; i <= 5; i++) {

                let value =
                    document.getElementById("subject" + i).value;

                if (value === "") {
                    showError("Please enter marks for all subjects.");
                    return;
                }

                value = Number(value);

                // Validate marks
                if (value < 0 || value > 100) {
                    showError(
                        "Marks must be between 0 and 100."
                    );
                    return;
                }

                marks.push(value);
            }

            // Calculate total
            let total = 0;

            for (let mark of marks) {
                total += mark;
            }

            // Calculate percentage
            let percentage = (total / 500) * 100;

            // Determine grade
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else if (percentage >= 40) {
                grade = "E";
            }
            else {
                grade = "F";
            }

            // Display result
            document.getElementById("total").textContent =
                total;

            document.getElementById("percentage").textContent =
                percentage.toFixed(2) + "%";

            document.getElementById("grade").textContent =
                grade;

            document.getElementById("result").style.display =
                "block";

            document.getElementById("error").textContent = "";
        }


        function showError(message) {

            document.getElementById("error").textContent =
                message;

            document.getElementById("result").style.display =
                "none";
        }


        function resetCalculator() {

            for (let i = 1; i <= 5; i++) {
                document.getElementById("subject" + i).value = "";
            }

            document.getElementById("result").style.display =
                "none";

            document.getElementById("error").textContent = "";
        }

    </script>

</body>
</html>
